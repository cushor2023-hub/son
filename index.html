<!DOCTYPE html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小小任務探險隊｜今日任務輪盤</title>
<style>
:root{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;color:#283e38;background:#f8f6ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background-image:radial-gradient(#dcded1 1px,transparent 1px);background-size:22px 22px}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #235caa;outline-offset:5px}header{max-width:1160px;margin:auto;padding:26px 30px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.badge{background:#fff;border:1px solid #e2e4d8;border-radius:24px;padding:10px 16px;font-size:14px}main{max-width:1160px;margin:auto;padding:12px 30px 40px}.intro{text-align:center}.eyebrow{font-size:13px;font-weight:800;letter-spacing:3px;color:#668570}h1{font-size:clamp(30px,5vw,48px);margin:12px 0;color:#254c3d;letter-spacing:3px}.intro p{color:#748078;line-height:1.8;margin:0}.layout{display:grid;grid-template-columns:1fr 1.1fr;gap:42px;margin-top:32px;align-items:center}.play{text-align:center;background:#eeefe1;border-radius:36px;padding:28px 20px 24px;position:relative}.wheel-wrap{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto 24px}.wheel{width:100%;height:100%;border-radius:50%;border:10px solid white;box-shadow:0 9px 0 #cbd3b9,0 16px 30px #334b3920;position:relative;transition:transform 2.8s cubic-bezier(.15,.65,.12,1);background:conic-gradient(#f4baa8 0deg 72deg,#f7d879 72deg 144deg,#a9cce7 144deg 216deg,#bbd6a6 216deg 288deg,#c7b7df 288deg)}.label{position:absolute;left:50%;top:50%;width:88px;margin-left:-44px;margin-top:-29px;font-size:20px;font-weight:900;line-height:1.6;transform:rotate(var(--a)) translateY(-104px) rotate(calc(-1 * var(--a)))}.label span{display:block;font-size:26px}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;display:grid;place-items:center;border-radius:50%;background:#fffaf0;border:5px solid white;font-size:34px;box-shadow:0 3px 8px #4442}.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:2;width:30px;height:40px;background:#315542;clip-path:polygon(0 0,100% 0,50% 100%)}.spin{background:#315b46;border:0;border-radius:20px;color:white;font-size:23px;font-weight:900;padding:17px 38px;box-shadow:0 6px 0 #1c3c2c;width:min(100%,330px)}.spin:hover{background:#3d6a52}.spin:disabled{opacity:.65;cursor:wait}.hint{font-size:13px;color:#71806c;margin:17px 0 0}.sheet{background:#fffef9;border:1px solid #e5e4d5;border-radius:28px;padding:26px;box-shadow:0 8px 24px #35423106}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.sheet h2{margin:0;font-size:23px}.count{font-size:14px;font-weight:bold;color:#78886d}.progress{height:9px;border-radius:10px;background:#eeeee4;margin:17px 0 22px;overflow:hidden}.progress div{background:#8bab70;height:100%;width:0;transition:width .4s}.cards{display:grid;gap:12px}.task{width:100%;text-align:left;border:1px solid #e8e9df;background:#fafbf5;border-radius:17px;min-height:84px;padding:14px 16px;display:flex;align-items:center;gap:14px;color:inherit}.num{font-size:12px;color:#8b9685;font-weight:bold}.icon{font-size:28px;min-width:38px;text-align:center}.task-copy{flex:1}.subject{font-size:12px;font-weight:bold;color:#7e8878;margin-bottom:5px}.task-name{font-size:19px;font-weight:800}.check{height:28px;width:28px;border:2px solid #d8ddce;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.task.done{background:#edf3e5;border-color:#b6caa7}.done .check{background:#6e9259;border-color:#6e9259;color:white}.done .task-name{color:#617854}.task:disabled{cursor:default}.message{text-align:center;font-size:14px;color:#7d8975;margin:22px 0 0;min-height:22px;line-height:1.6}.catalog{margin-top:34px}.catalog h2{font-size:18px;margin:0 0 15px}.subjects{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.subject-box{border-radius:16px;background:#fffdf6;border:1px solid #e4e5da;padding:16px 12px}.subject-box strong{display:block;font-size:15px;margin-bottom:9px}.subject-box p{font-size:12px;color:#798275;line-height:1.9;margin:0}.footer{text-align:center;font-size:12px;color:#8b9385;margin-top:25px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti span{position:absolute;top:-50px;font-size:25px;animation:fall 2.6s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(250deg)}}@media(max-width:760px){header{padding:20px}.badge{font-size:12px}main{padding:5px 18px 25px}.layout{grid-template-columns:1fr;gap:24px;margin-top:24px}.wheel-wrap{width:280px}.label{transform:rotate(var(--a)) translateY(-84px) rotate(calc(-1 * var(--a)));font-size:17px}.subjects{grid-template-columns:repeat(3,1fr)}.sheet{padding:20px}.play{padding:26px 15px}.intro p{font-size:14px}h1{letter-spacing:1px}}@media(prefers-reduced-motion:reduce){.wheel{transition-duration:.01s}.confetti{display:none}}
</style>
<header><div class="brand">🌱 小小任務探險隊</div><div class="badge" id="date"></div></header>
<main><section class="intro"><div class="eyebrow">每天一點點，長大一點點</div><h1>今天，來點小挑戰！</h1><p>轉一轉幸運輪盤，找到今天的 4 個任務。<br>完成一個，就幫自己打個勾！</p></section>
<div class="layout"><section class="play" aria-label="任務輪盤"><div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel"><div class="label" style="--a:36deg"><span>📖</span>國文</div><div class="label" style="--a:108deg"><span>🔢</span>數學</div><div class="label" style="--a:180deg"><span>🔤</span>英文</div><div class="label" style="--a:252deg"><span>🏡</span>生活</div><div class="label" style="--a:324deg"><span>🏸</span>體育</div></div><div class="hub">🌟</div></div><button class="spin" id="spin">🎲 抽出今日任務</button><p class="hint">抽出 4 個不同科目，每科 1 個任務</p></section>
<section class="sheet"><div class="sheet-head"><h2>📋 我的今日課表</h2><span class="count" id="count">準備出發！</span></div><div class="progress" role="progressbar" aria-label="今日任務完成進度" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><div id="bar"></div></div><div class="cards" id="cards"></div><p class="message" id="message" aria-live="polite">按下輪盤，看看今天會遇到什麼！</p></section></div>
<section class="catalog"><h2>🎒 我的小小任務庫</h2><div class="subjects" id="subjects"></div></section><p class="footer">慢慢來也沒關係，每完成一件事，都很棒。☀️</p></main><div class="confetti" id="confetti" aria-hidden="true"></div>
<script>
'use strict';
const subjects=[{name:'國文',icon:'📖',tasks:['閱讀','弟子規']},{name:'數學',icon:'🔢',tasks:['加加看15題','九九乘法','邏輯數學本']},{name:'英文',icon:'🔤',tasks:['單字10個','A到Z大小寫']},{name:'生活',icon:'🏡',tasks:['作家事一件','迷宮3頁','樂高積木三頁','畫圖','黏土']},{name:'體育',icon:'🏸',tasks:['打羽球','跑步','敷皮克敏一盆','體操']},{name:'思考',icon:'💭',tasks:[]}];
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('sv-SE'),key='little-missions-v1';let tasks=[],rotation=0,busy=false;
function save(){try{localStorage.setItem(key,JSON.stringify({date:today(),tasks}));}catch{}}
function celebrate(){const box=$('confetti');box.replaceChildren();for(let i=0;i<24;i++){const s=document.createElement('span');s.textContent=['⭐','🌟','🎉','🌼'][i%4];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.5+'s';box.append(s);}setTimeout(()=>box.replaceChildren(),3300);}
function render(){const cards=$('cards');cards.replaceChildren();let done=tasks.filter(t=>t.done).length;for(let i=0;i<4;i++){const t=tasks[i],b=document.createElement('button');b.className='task'+(t?.done?' done':'');b.disabled=!t||busy;b.type='button';if(t)b.setAttribute('aria-pressed',String(t.done));const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const icon=document.createElement('span');icon.className='icon';icon.textContent=t?t.icon:'🌱';const copy=document.createElement('div');copy.className='task-copy';const subject=document.createElement('div');subject.className='subject';subject.textContent=t?t.subject:'第 '+(i+1)+' 個任務';const name=document.createElement('div');name.className='task-name';name.textContent=t?t.name:'等待輪盤的驚喜';copy.append(subject,name);const check=document.createElement('span');check.className='check';check.textContent=t?.done?'✓':'';b.append(num,icon,copy,check);b.onclick=()=>{if(busy)return;t.done=!t.done;save();render();if(tasks.every(x=>x.done))celebrate();};cards.append(b);} $('count').textContent=tasks.length?done+' / 4 已完成':'準備出發！';$('bar').style.width=done*25+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',done);$('message').textContent=tasks.length?(done===4?'🎉 今天的任務全部完成！你真棒！':'每完成一個任務，就點卡片打勾吧！'):'按下輪盤，看看今天會遇到什麼！';$('spin').textContent=tasks.length?'🎲 再抽一次':'🎲 抽出今日任務';}
function draw(){const pool=subjects.filter(s=>s.tasks.length);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}return pool.slice(0,4).map(s=>({subject:s.name,icon:s.icon,name:s.tasks[Math.floor(Math.random()*s.tasks.length)],done:false}));}
$('spin').onclick=()=>{if(busy)return;if(tasks.length&&!confirm('要重新抽選嗎？目前的任務和完成紀錄會被換掉喔。'))return;busy=true;$('spin').disabled=true;render();$('spin').textContent='🌟 輪盤轉呀轉…';$('message').textContent='今天的小挑戰，馬上揭曉！';const picked=draw();const first=subjects.findIndex(s=>s.name===picked[0].subject);const target=(360-(first*72+36))%360;rotation+=1440+((target-rotation%360+360)%360);$('wheel').style.transform='rotate('+rotation+'deg)';setTimeout(()=>{tasks=picked;busy=false;$('spin').disabled=false;save();render();},matchMedia('(prefers-reduced-motion: reduce)').matches?50:2850);};
$('date').textContent=new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});
for(const s of subjects){const box=document.createElement('div');box.className='subject-box';const title=document.createElement('strong');title.textContent=s.icon+' '+s.name;const p=document.createElement('p');p.textContent=s.tasks.join(' / ')||'尚未設定任務';box.append(title,p);$('subjects').append(box);}
try{const stored=JSON.parse(localStorage.getItem(key));if(stored?.date===today()&&Array.isArray(stored.tasks)&&stored.tasks.length===4&&new Set(stored.tasks.map(t=>t.subject)).size===4&&stored.tasks.every(t=>subjects.some(s=>s.name===t.subject&&s.icon===t.icon&&s.tasks.includes(t.name))&&typeof t.done==='boolean'))tasks=stored.tasks;}catch{}render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy){$('date').textContent=new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});try{const s=JSON.parse(localStorage.getItem(key));if(s&&s.date!==today()){tasks=[];render();}}catch{}}});
</script>
</html>
